<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SSP Invoices">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sunstate Site Invoices</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#DA2127; --red-d:#B3171D; --orange:#F08A1F; --yellow:#F9C012;
  --ink:#1E1A19; --ink2:#47403D; --muted:#7D7470; --faint:#A69D99;
  --line:#ECE6E1; --bg:#F6F3F0; --card:#FFFFFF; --soft:#FBF8F6;
  --green:#17794A; --green-bg:#E6F4EC; --amber:#9A5200; --amber-bg:#FFF1DC;
  --grad:linear-gradient(120deg,#DA2127 0%,#E9531F 52%,#F39A1B 100%);
  --grad-sun:linear-gradient(90deg,#F9C012 0%,#F08A1F 50%,#DA2127 100%);
  --shadow:0 1px 2px rgba(30,26,25,.05),0 6px 20px rgba(30,26,25,.06);
  --r:18px; --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{display:block}
.hidden{display:none!important}
.sm{font-size:13px}.xs{font-size:12px}.muted{color:var(--muted)}.b{font-weight:700}

/* app bar */
.appbar{position:sticky;top:0;z-index:40;background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 var(--line)}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--grad-sun)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:36px;height:36px;flex:none}
.wm{display:flex;flex-direction:column;font-family:var(--cond);font-weight:800;font-size:17px;line-height:15px;letter-spacing:.02em}
.wm-y{color:var(--yellow)}.wm-r{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:52vw;padding:7px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip svg{flex:none}

/* layout */
.page{max-width:640px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}
.page.wide{max-width:880px}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(30,26,25,.04)}
.card-pad{padding:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 16px 6px}
.card-h h2,.h2{font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.01em;text-transform:uppercase}
.h1{font-family:var(--cond);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.lead{color:var(--muted);font-size:14px;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:10px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 20px;color:#fff;background:var(--grad);box-shadow:0 10px 30px rgba(218,33,39,.22)}
.hero .mark{position:absolute;right:-34px;bottom:-40px;width:170px;height:170px;opacity:.16;filter:brightness(0) invert(1)}
.hero-k{font-size:14px;opacity:.92;font-weight:600}
.hero-t{font-family:var(--cond);font-weight:800;font-size:34px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em;margin-top:2px;max-width:85%}
.hero-s{font-size:13px;opacity:.88;margin-top:6px}
.hero.dark{background:linear-gradient(140deg,#2A2321 0%,#1E1A19 100%);box-shadow:0 10px 30px rgba(30,26,25,.22)}
.hero.dark .mark{opacity:1;filter:none;width:150px;height:150px;right:-30px;bottom:-34px;opacity:.9}
.hero .big{font-family:var(--cond);font-weight:800;font-size:56px;line-height:1}
.hero-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative}

/* actions */
.actions{display:grid;gap:12px}
.action{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(30,26,25,.04)}
.action:active{transform:scale(.99)}
.action-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--grad);color:#fff}
.action-ic.ic-dark{background:var(--ink)}
.action-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.action-txt strong{font-size:17px}
.action-txt small{color:var(--muted);font-size:13px;margin-top:2px}
.action>svg{color:var(--faint);flex:none}

/* lists */
.list{list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.list>li:first-child>.row,.list>.row:first-child{border-top:0}
button.row:active,a.row:active{background:var(--soft)}
.row-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--ink2);flex:none}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>svg{color:var(--faint);flex:none}
.empty{padding:26px 16px 28px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{display:block;color:var(--faint);margin:0 auto 8px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill-new{background:var(--amber-bg);color:var(--amber)}
.pill-done{background:var(--green-bg);color:var(--green)}
.pill-count{background:var(--red);color:#fff;min-width:24px;justify-content:center}
.pill-grey{background:var(--soft);color:var(--muted);border:1px solid var(--line)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--soft);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 16px rgba(218,33,39,.25)}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-white{background:#fff;color:var(--ink);border:0}
.btn-ghost-w{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
.btn-danger{background:#fff;color:var(--red);border-color:#F3C9CA}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1}
.link{color:var(--red);font-weight:700;font-size:14px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint);padding:6px 0}
.nav a.on{color:var(--red)}
.nav .fab{flex:none;width:62px;height:62px;margin-top:-26px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(218,33,39,.35);border:4px solid #fff;padding:0}

/* forms */
.field{display:block}
.field+.field{margin-top:14px}
.label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.label em{font-style:normal;color:var(--faint);font-weight:600}
.input{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(240,138,31,.15)}
.input.filled{background:#FFFBF2;border-color:#F6D79A}
textarea.input{min-height:76px;resize:vertical}
.money{position:relative}.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}.money .input{padding-left:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.grid2 .field+.field{margin-top:0}
.err{background:#FDEDED;border:1px solid #F5C6C7;color:#9B1C1F;padding:11px 14px;border-radius:12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.note{background:var(--amber-bg);color:#6B3B00;padding:11px 14px;border-radius:12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.ok{background:var(--green-bg);color:#0E5634}
.note svg,.err svg{flex:none;margin-top:1px}

/* photo capture */
.drop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop button{background:#fff;border:2px dashed #E3D9D3;border-radius:var(--r);padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;color:var(--ink2)}
.drop button svg{color:var(--red)}
.drop button small{color:var(--muted);font-weight:500;font-size:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#eee;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .n{position:absolute;left:6px;bottom:6px;background:rgba(30,26,25,.75);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.thumb .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(30,26,25,.75);color:#fff;display:grid;place-items:center}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #E3D9D3;background:#fff;color:var(--red);font-size:12px;font-weight:700}
.thumb.busy{display:grid;place-items:center;color:var(--muted);font-size:12px}

/* sticky footer */
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(246,243,240,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.footbar-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.footbar-in .btn{flex:1}.footbar-in .btn-primary{flex:2}

/* progress */
.center{text-align:center;padding:40px 10px}
.bar{height:8px;border-radius:99px;background:#EDE5DF;overflow:hidden;margin:16px auto 0;max-width:280px}
.bar>div{height:100%;background:var(--grad-sun);border-radius:99px;transition:width .3s}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
.badge-ok{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 12px 30px rgba(218,33,39,.3)}
.sym-lg{width:92px;height:92px;margin:0 auto 14px}

/* tabs & chips */
.tabs{display:flex;background:#EDE7E2;border-radius:13px;padding:4px;gap:4px}
.tabs button{flex:1;padding:9px 8px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.sel{flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink2)}
.sel.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,16,15,.48);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;overflow:hidden}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;background:#fff;border-bottom:1px solid var(--line)}
.sheet-h .t{flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);color:var(--ink2);flex:none}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.dialog{max-width:420px}
.pages img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.pages a+a{margin-top:10px;display:block}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{font-weight:650;word-break:break-word}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos a{aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#eee}
.photos img{width:100%;height:100%;object-fit:cover}

/* toast & busy */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:fade .2s}
.toast.bad{background:var(--red-d)}
.busy{position:fixed;inset:0;z-index:90;background:rgba(246,243,240,.9);display:grid;place-items:center;padding:20px}
.busy .card{padding:26px 22px;text-align:center;width:100%;max-width:340px}
.footer{text-align:center;color:var(--faint);font-size:12px;margin-top:26px}
.footer b{font-family:var(--cond);letter-spacing:.04em;font-weight:700}
.sep{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:13px;font-weight:600;margin:4px 6px 0 0}
.tag button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.selectwrap select{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================== basics */
const $app = document.getElementById('app');
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ssp.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ssp.' + k, JSON.stringify(v)); } catch (e) {} },
};

function h(tag, props) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach((x) => add(el, x)); return; }
  el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
}

const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',

  images: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  chevR: '<polyline points="9 18 15 12 9 6"/>',
  chevL: '<polyline points="15 18 9 12 15 6"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  edit: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  ext: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
  fuel: '<path d="M3 22V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v17"/><line x1="2" y1="22" x2="15" y2="22"/><rect x="6" y="6" width="5" height="4" rx=".5"/><path d="M14 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
  spark: '<path d="M12 3l1.9 4.9L19 9.8l-5.1 1.9L12 17l-1.9-5.3L5 9.8l5.1-1.9z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/>',

/* =========================================================== formatting */
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function bneDate(iso) { const d = new Date(iso); return isNaN(d) ? null : new Date(d.getTime() + 10 * 3600e3); }
function fmtDay(ymd) { if (!ymd) return ''; const [y, m, d] = ymd.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return DAYS[dt.getUTCDay()] + ' ' + d + ' ' + MONTHS[m - 1].slice(0, 3) + (y !== thisYear() ? ' ' + y : ''); }
function fmtLongDay(ymd) { const [y, m, d] = ymd.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dt.getUTCDay()] + ' ' + d + ' ' + MONTHS[m - 1] + ' ' + y; }
function fmtMonth(ym) { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1].slice(0, 3) + ' ' + y; }
function fmtMonthLong(ym) { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; }
function thisYear() { return Number((S.cfg && S.cfg.today || '2000').slice(0, 4)); }
function fmtWhen(iso) {
  const d = bneDate(iso); if (!d) return '';
  const ymd = d.toISOString().slice(0, 10);
  let hr = d.getUTCHours(); const mi = String(d.getUTCMinutes()).padStart(2, '0'); const ap = hr >= 12 ? 'pm' : 'am'; hr = hr % 12 || 12;
  const t = hr + ':' + mi + ap;
  if (S.cfg && ymd === S.cfg.today) return 'Today ' + t;
  return fmtDay(ymd) + ', ' + t;
}
function fmtMoney(v) { if (v === '' || v == null) return ''; const n = Number(v); return isNaN(n) ? '' : '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function greeting() { const hr = (new Date().getUTCHours() + 10) % 24; return hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'; }
function safeName(s) { return String(s || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 90) || 'file'; }
function docketName(n) { return String(n || '').replace(/_/g, ' '); }

/* =========================================================== api */
async function api(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.json !== undefined) { init.method = opts.method || 'POST'; init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(opts.json); }
  if (opts.body) { init.body = opts.body; if (opts.type) init.headers['content-type'] = opts.type; }
  let res;
  try { res = await fetch(path, init); } catch (e) { throw new Error('No connection. Check your signal and try again.'); }
  const ct = res.headers.get('content-type') || '';
  const data = ct.includes('json') ? await res.json().catch(() => null) : null;
  if (res.status === 401 && S.cfg && (path.startsWith('/api/office') || path.startsWith('/api/staff'))) {
    if (path.startsWith('/api/office')) S.cfg.officeOk = false; else S.cfg.staffOk = false;
    S.busy = null;
    render();
  }
  if (!res.ok) { const err = new Error((data && data.error) || 'Something went wrong (' + res.status + ').'); err.status = res.status; throw err; }
  return data;
}
async function fetchBytes(url) {
  const res = await fetch(url, { credentials: 'same-origin' });
  if (!res.ok) throw new Error('Could not download a photo (' + res.status + ').');
  return new Uint8Array(await res.arrayBuffer());
}

function render() {
  const active = document.activeElement;

  const office = S.route[0] === 'office';
  const v = view();
  const nodes = [header(office), v];
  if (showNav()) nodes.push(nav(office));

  if (S.toast) nodes.push(h('div', { class: 'toast' + (S.toast.bad ? ' bad' : ''), role: 'status' }, S.toast.msg));
  $app.replaceChildren.apply($app, nodes);
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} }
  }
}

async function addPages(fileList) {

function compressImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, hh = img.naturalHeight;
      if (Math.max(w, hh) > max) { const k = max / Math.max(w, hh); w = Math.round(w * k); hh = Math.round(hh * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = hh;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh); ctx.drawImage(img, 0, 0, w, hh);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve({ blob: b, w, h: hh }) : reject(new Error('encode')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };

}
async function blobToBase64(blob) {

  let s = ''; const CH = 0x8000;
  for (let i = 0; i < buf.length; i += CH) s += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
  return btoa(s);
}

/* ---------- auto-fill: reads the photo through Fuel Dockets' Claude proxy */
const AUTOFILL_PROMPT = 'These photos are the pages of one supplier invoice (or delivery docket) received at an Australian service station. ' +
  'Read them and return the details as JSON only, with no other text:\n' +
  '{"supplier":"trading name of the business that issued the invoice, short and without Pty Ltd","invoiceNo":"invoice or document number","invoiceDate":"YYYY-MM-DD","total":"total amount payable including GST as a plain number, e.g. 1234.50"}\n' +
  'The supplier is the company that sent the invoice, not the customer (the customer is the service station). Use null for anything you cannot read clearly. Dates on Australian invoices are day/month/year.';

async function runAutofill() {
  const d = S.draft; if (!d || !d.pages.length) return;
  d.auto = { status: 'reading' }; render();
  try {
    const pages = d.pages.slice(0, 3);
    const imgs = [];
    for (const p of pages) { const small = await compressImage(p.blob, 1500, 0.8); imgs.push(await blobToBase64(small.blob)); }
    const body = { model: S.cfg.autofillModel, max_tokens: 300, messages: [{ role: 'user', content: imgs.map((b) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b } })).concat([{ type: 'text', text: AUTOFILL_PROMPT }]) }] };
    const res = await api('/api/staff/autofill', { json: body });
    const text = ((res && res.content) || []).map((b) => b.text || '').join('');
    const m = text.match(/\{[\s\S]*\}/);
    const out = m ? JSON.parse(m[0]) : {};
    if (S.draft !== d) return;
    let count = 0;
    const put = (k, v) => { if (v == null || v === '' || d.touched[k]) return; d.f[k] = String(v); d.filled[k] = true; count++; };
    put('supplier', matchSupplier(out.supplier));
    put('invoiceNo', out.invoiceNo ? String(out.invoiceNo).slice(0, 40) : '');
    if (out.invoiceDate && /^\d{4}-\d{2}-\d{2}$/.test(out.invoiceDate)) put('invoiceDate', out.invoiceDate);
    if (out.total != null && !isNaN(Number(String(out.total).replace(/[$,]/g, '')))) put('total', Number(String(out.total).replace(/[$,]/g, '')).toFixed(2));
    d.auto = { status: 'done', count };
  } catch (e) {
    if (S.draft === d) d.auto = { status: 'failed' };
  }
  if (S.route[0] === 'upload' && S.up.status === 'idle') render();
}
function normSup(s) { return String(s || '').toLowerCase().replace(/\b(pty|ltd|limited|australia|aust|the|co|inc)\b/g, '').replace(/[^a-z0-9]/g, ''); }
function matchSupplier(name) {
  if (!name) return '';
  name = String(name).replace(/[\s,]*\b(pty\.?\s*ltd\.?|pty\.?\s*limited|limited|ltd\.?)\s*$/i, '').trim();
  const n = normSup(name);
  if (!n) return String(name).slice(0, 80);
  for (const s of S.suppliers) {
    const k = normSup(s);
    if (k && (k === n || (k.length >= 4 && (n.includes(k) || k.includes(n))) || lev(k, n) <= 2)) return s;
  }
  return String(name).slice(0, 80);
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 9;
  const dp = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = dp[j]; dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return dp[b.length];
}

/* ---------- send */
async function send() {
  const d = S.draft; if (!d) return;
  const missing = !d.pages.length ? 'Add a photo of the invoice.' : d.preparing ? 'Wait for the photos to finish preparing.' : !d.f.supplier.trim() ? 'Enter the supplier.' : !d.f.by.trim() ? 'Enter your name so the office knows who sent it.' : '';
  if (missing) { d.err = missing; render(); const e = document.getElementById('draft-err'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  d.err = '';
  S.by = d.f.by.trim(); LS.set('by', S.by);
  const site = currentSite();
  S.up = { status: 'sending', done: d.pages.filter((p) => p.sent).length, total: d.pages.length, msg: 'Starting…' };
  render();
  try {
    if (!d.slot || d.slot.site !== site.id) {
      const start = await api('/api/staff/start', { json: { site: site.id, supplier: d.f.supplier, invoiceNo: d.f.invoiceNo } });
      if (start.duplicate && !d.dupOk) {
        S.up = { status: 'idle' }; render();
        const dup = start.duplicate;
        openDialog('Already sent?', 'Invoice ' + (dup.invoiceNo ? '#' + dup.invoiceNo + ' ' : '') + 'from ' + dup.supplier + ' was sent ' + fmtWhen(dup.uploadedAt).replace(/^Today/, 'today') + (dup.by ? ' by ' + dup.by : '') + '. Send it again anyway?', [
          { label: 'Cancel' },
          { label: 'Send again', primary: true, run: () => { d.dupOk = true; send(); } }]);
        return;
      }
      d.slot = { site: site.id, id: start.id, month: start.month };
      d.pages.forEach((p) => { p.sent = false; });
    }
    for (let i = 0; i < d.pages.length; i++) {
      if (d.pages[i].sent) continue;
      S.up.msg = 'Uploading page ' + (i + 1) + ' of ' + d.pages.length; render();
      await api('/api/staff/page/' + [d.slot.site, d.slot.month, d.slot.id, i + 1].map(encodeURIComponent).join('/'), { method: 'PUT', body: d.pages[i].blob, type: 'image/jpeg' });
      d.pages[i].sent = true;
      S.up.done = d.pages.filter((p) => p.sent).length; render();
    }
    S.up.msg = 'Finishing…'; render();
    const fin = await api('/api/staff/finish', { json: Object.assign({ site: d.slot.site, month: d.slot.month, id: d.slot.id, pages: d.pages.length }, d.f) });
    S.up = { status: 'done', record: fin.record };
    d.pages.forEach((p) => URL.revokeObjectURL(p.url));
    S.draft = null; S.recent = null;
    if (fin.record && fin.record.supplier && !S.suppliers.includes(fin.record.supplier)) S.suppliers.unshift(fin.record.supplier);
  } catch (e) {
    S.up = Object.assign({}, S.up, { status: 'error', error: e.message });
  }
  render();
}

    let content;
    if (S.off.dk === 'loading' || !sitesFull) content = h('p', { class: 'sm muted pulse' }, 'Loading Fuel Dockets locations…');
    else if (S.off.dkErr) content = h('div', { class: 'err' }, icon('alert', 18), S.off.dkErr);
    else if (!S.off.dk || !S.off.dk.length) content = h('p', { class: 'sm muted' }, 'No locations in Fuel Dockets yet.');
    else {
      const linkedTo = {};
      sitesFull.forEach((s) => (s.dockets || []).forEach((d) => { linkedTo[d] = s; }));
      content = h('div', { class: 'list', style: 'margin:0 -16px -16px' }, S.off.dk.map((l) => docketLinkRow(l.name, linkedTo[l.name], sitesFull)));
    }
    docketBox = h('section', { class: 'card card-pad' },
      h('h2', { class: 'h2' }, 'Fuel Dockets locations'),
      h('p', { class: 'lead', style: 'margin-bottom:12px' }, 'Drivers type the location in Fuel Dockets. Link each one to a site so its dockets show next to that site’s invoices.'),
      content);
  }

  let list;
  if (!sitesFull) list = h('div', { class: 'empty pulse' }, 'Loading…');
  else if (!sitesFull.length) list = h('div', { class: 'empty' }, 'No sites yet.');
  else list = h('div', { class: 'list' }, sitesFull.map((s) => h('div', { class: 'row' },
    h('span', { class: 'row-ic' }, icon(s.archived ? 'archive' : 'store', 19)),
    h('span', { class: 'row-main' },
      h('span', { class: 'row-t', style: 'display:block' + (s.archived ? ';color:var(--muted)' : '') }, s.name),
      h('span', { class: 'row-s', style: 'display:block' }, s.archived ? 'Archived · hidden from staff' : (s.dockets.length ? 'Dockets: ' + s.dockets.map(docketName).join(', ') : 'No dockets linked'))),
    h('button', { class: 'iconbtn', title: 'Rename', 'aria-label': 'Rename ' + s.name, onclick: () => renameSite(s) }, icon('edit', 16)),
    h('button', { class: 'iconbtn', title: s.archived ? 'Restore' : 'Archive', 'aria-label': (s.archived ? 'Restore ' : 'Archive ') + s.name, onclick: () => siteAction({ action: 'update', id: s.id, archived: !s.archived }, s.archived ? 'Site restored.' : 'Site archived.') }, icon(s.archived ? 'refresh' : 'archive', 16)))));

  return h('main', { class: 'page stack wide' },
    h('div', null, h('a', { class: 'back', href: '#/office' }, icon('chevL', 18), 'Office'), h('h1', { class: 'h1' }, 'Manage sites')),
    addBox, docketBox,
    h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, 'Sites'), sitesFull ? h('span', { class: 'sm muted' }, String(sitesFull.length)) : null), list));
}
function suggestSite(docket, sites) {
  const strip = (s) => s.toLowerCase().replace(/#\s*\d+/g, '').replace(/\b(shell|liberty|caltex|bp|ampol|puma|united|metro|mobil|7-eleven|sunstate|ssp|servo|service station|fuel)\b/g, '').replace(/[^a-z0-9]/g, '');
  const k = strip(docketName(docket));
  if (!k) return null;
  let best = null, bestScore = 9;
  for (const s of sites) {
    if (s.archived) continue;
    const n = strip(s.name);
    if (!n) continue;
    const score = n === k ? 0 : (n.length >= 4 && (k.includes(n) || n.includes(k))) ? 1 : lev(n, k);
    if (score < bestScore) { best = s; bestScore = score; }
  }
  return bestScore <= 2 ? best : null;
}
function docketLinkRow(name, site, sites) {
  if (site) {
    return h('div', { class: 'row' },
      h('span', { class: 'row-ic' }, icon('fuel', 18)),
      h('span', { class: 'row-main' }, h('span', { class: 'row-t', style: 'display:block' }, docketName(name)), h('span', { class: 'row-s', style: 'display:block' }, 'Linked to ' + site.name)),
      h('button', { class: 'btn btn-sm', onclick: () => siteAction({ action: 'update', id: site.id, dockets: site.dockets.filter((d) => d !== name) }, 'Unlinked.') }, 'Unlink'));
  }
  const guess = suggestSite(name, sites);
  const select = h('select', { 'aria-label': 'Link ' + docketName(name) + ' to a site', onchange: async (e) => {
    const v = e.target.value;
    if (!v) return;
    if (v === '__new') await siteAction({ action: 'add', names: [docketName(name)], docket: name }, 'Site added and linked.');
    else { const s = sites.find((x) => x.id === v); await siteAction({ action: 'update', id: v, dockets: (s.dockets || []).concat([name]) }, 'Linked to ' + s.name + '.'); }
  } },
  h('option', { value: '' }, 'Link to a site…'),
  sites.filter((s) => !s.archived).map((s) => h('option', { value: s.id }, s.name)),
  h('option', { value: '__new' }, '+ New site called “' + docketName(name) + '”'));
  return h('div', { class: 'row', style: 'flex-wrap:wrap' },
    h('span', { class: 'row-ic' }, icon('fuel', 18)),
    h('span', { class: 'row-main' }, h('span', { class: 'row-t', style: 'display:block' }, docketName(name)), h('span', { class: 'row-s', style: 'display:block;color:var(--amber)' }, 'Not linked')),
    guess ? h('button', { class: 'btn btn-sm btn-dark', onclick: () => siteAction({ action: 'update', id: guess.id, dockets: (guess.dockets || []).concat([name]) }, 'Linked to ' + guess.name + '.') }, icon('link', 14), guess.name) : null,
    h('div', { class: 'selectwrap', style: 'flex-basis:100%;padding-left:50px' }, select));
}
function renameSite(s) {
  const input = h('input', { class: 'input', id: 'rename-site', value: s.name });
  S.sheet = { kind: 'dialog', title: 'Rename site', text: '', body: h('div', { style: 'margin-top:12px' }, input), actions: [
    { label: 'Cancel' },
    { label: 'Save', primary: true, run: () => siteAction({ action: 'update', id: s.id, name: input.value }, 'Renamed.') }] };
  render();
  setTimeout(() => { const el = document.getElementById('rename-site'); if (el) el.select(); }, 30);
}
async function siteAction(body, okMsg) {
  try {
    const d = await api('/api/office/sites', { json: body });
    S.cfg.sites = d.sites.map((s) => ({ id: s.id, name: s.name, archived: !!s.archived }));
    S.off.inv = {};
    toast(okMsg);
    loadOverview();
  } catch (e) { toast(e.message, true); }
}

/* =========================================================== boot */
async function boot() {
  S.cfgErr = ''; render();
  try { S.cfg = await api('/api/config'); }
  catch (e) { S.cfgErr = e.message; render(); return; }
  if (S.siteId && !currentSite()) { S.siteId = ''; }
  onRoute();
}
S.route = parseHash();
boot();
</script>
</body>
