name = "siteinvoices"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep variables added in the Cloudflare dashboard when this repo redeploys.
keep_vars = true

[observability]
enabled = true

# Invoice photos and details. Create an R2 bucket called sunstate-invoices in the Cloudflare
# dashboard (R2 Object Storage > Create bucket) before the first deploy.
[[r2_buckets]]
binding = "INVOICES"
bucket_name = "sunstate-invoices"

[vars]
# The old Fuel Dockets app. Only used to bring its existing dockets across (Office > Manage sites)
# and, until this Worker has its own ANTHROPIC_API_KEY secret, to read photos through its Claude
# connection. Once both are done the old app can be switched off.
DOCKETS_URL = "https://fueldockets.jaidenbanks88.workers.dev"
# Set to "off" to stop reading invoice and docket photos automatically.
AUTOFILL = "on"

# Lets index.js import the app page as text and the logo images as bytes.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
